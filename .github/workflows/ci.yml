name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a0400024711b283056538ac19ced80b91a83c24c

      - name: Install vcpkg deps
        run: |
          & $env:VCPKG_ROOT/vcpkg.exe install --triplet=x64-windows --x-manifest-root=native --x-install-root=native/vcpkg_installed

      - name: Build C++
        run: |
          cmake -S native --preset bottlemusic-check
          cmake --build native/out/bottlemusic-check --config Debug

      - name: Run CTest
        run: ctest --preset bottlemusic-check
        working-directory: native

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Run Vitest
        run: pnpm test
        working-directory: ui

      - name: Typecheck
        run: npx vue-tsc --noEmit
        working-directory: ui

      - name: Cargo test
        run: |
          $root = (Resolve-Path ../..).Path
          $env:PATH = "$root\native\out\bottlemusic-check;$root\native\vcpkg_installed\x64-windows\bin;$env:PATH"
          # --no-default-features: tray-icon / global-shortcut crash the lib test harness
          # --tests (not --lib): also run the integration tests under tests/
          # (playback_ffi_test, cross_layer_contract_test). --lib silently
          # skipped them, which is how a broken tree stayed green.
          cargo test --tests --no-default-features -- --test-threads=1
        working-directory: ui/src-tauri

      - name: Cargo check (default desktop features)
        run: |
          $root = (Resolve-Path ../..).Path
          $env:PATH = "$root\native\out\bottlemusic-check;$root\native\vcpkg_installed\x64-windows\bin;$env:PATH"
          # Ensure default features (tray-icon/global-shortcut) still compile in PR,
          # even though they crash the lib test harness above. Release tests default features.
          cargo check --lib
        working-directory: ui/src-tauri

      - name: Cargo clippy
        run: cargo clippy --no-default-features -- -D warnings
        working-directory: ui/src-tauri
