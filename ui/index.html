<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Player</title>
    <script>
      // FOUC prevention: apply skin/mode before Vue mounts
      (function() {
        var s = localStorage.getItem('tweak_skin') || 'aurora';
        var m = localStorage.getItem('tweak_mode') || 'light';
        document.documentElement.dataset.skin = s;
        document.documentElement.dataset.mode = m;
        // Clear legacy frosted-glass prefs that fog the whole window
        try {
          localStorage.setItem('tweak_blur', '0');
          localStorage.setItem('tweak_grain', '0');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
