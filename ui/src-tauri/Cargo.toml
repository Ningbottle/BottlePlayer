[package]
name = "ui"
version = "1.0.0"
description = "A dual-interface Windows music player built with Tauri"
authors = ["Ningbottle"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Ningbottle/BottlePlayer"
homepage = "https://github.com/Ningbottle/BottlePlayer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is behind `desktop-shell` — enabling it for `cargo test --lib`
# previously crashed the harness (STATUS_ENTRYPOINT_NOT_FOUND).
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
sysinfo = "0.30"
libloading = "0.9.0"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
getrandom = "0.2"

[features]
default = ["desktop-shell"]
desktop-shell = ["tauri/tray-icon", "dep:tauri-plugin-global-shortcut"]
